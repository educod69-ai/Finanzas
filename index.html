<style>
:root{
  --bg:#f4f6f8;--card:#ffffff;--card2:#f0f2f5;--text:#14181f;--muted:#6b7380;--line:#e3e7ec;
  --accent:#0f9d7a;--accent2:#0b7f63;--inc:#12a36b;--exp:#e5484d;--sav:#3b82f6;--warn:#f59e0b;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
  --r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1216;--card:#181c22;--card2:#20252d;--text:#eef1f5;--muted:#9099a6;--line:#2a3039;
  --accent:#22c39a;--accent2:#1aa883;--inc:#2fcf8a;--exp:#ff6369;--sav:#60a5fa;--warn:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + var(--safe-b));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;border:0;background:none}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);padding:calc(var(--safe-t) + 10px) 16px 8px;border-bottom:1px solid transparent}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:750;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#14b88f,#0b7f63);display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:3px}
.monthnav button{width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--muted)}
.monthnav button:active{background:var(--card2)}
.monthnav .ml{width:auto;padding:0 8px;min-width:118px;font-weight:650;font-size:14px;color:var(--text);border-radius:999px}
main{max-width:1100px;margin:0 auto;padding:8px 16px 24px}
.tab{display:none;animation:fade .2s ease}
.tab.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
h2 button{color:var(--accent);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:1fr 1fr}
.kpi .l{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:750;letter-spacing:-.02em;margin-top:4px;white-space:nowrap}
.kpi.big{grid-column:1/-1;background:linear-gradient(135deg,#0f9d7a,#0b6f57);color:#fff}
.kpi.big .l{color:rgba(255,255,255,.8)}.kpi.big .v{font-size:32px}
.kpi.big .sub{font-size:13px;opacity:.85;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.inc{color:var(--inc)}.exp{color:var(--exp)}.sav{color:var(--sav)}
.tax{display:flex;gap:14px;align-items:center}
.tax .ic{font-size:26px;width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--warn) 18%,transparent);display:grid;place-items:center;flex:none}
.tax b{font-size:20px}
.muted{color:var(--muted)}.small{font-size:13px}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donutwrap svg{flex:none}
.legend{flex:1;min-width:170px;display:grid;gap:6px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.legend span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend span.p{color:var(--muted);font-size:12px;width:38px;text-align:right}
.chartlegend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;justify-content:center}
.chartlegend span{display:flex;align-items:center;gap:5px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.bar.warn>i{background:var(--warn)}.bar.over>i{background:var(--exp)}
.budget{padding:10px 0;border-bottom:1px solid var(--line)}
.budget:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.tag{font-size:11px;font-weight:650;padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--muted)}
.tag.over{background:color-mix(in srgb,var(--exp) 16%,transparent);color:var(--exp)}
.tag.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:#b77900}
@media (prefers-color-scheme:dark){.tag.warn{color:var(--warn)}}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.day{font-size:12px;font-weight:650;color:var(--muted);padding:12px 16px 4px;background:var(--card);text-transform:capitalize;display:flex;justify-content:space-between}
.tx{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left}
.tx:active{background:var(--card2)}
.tx .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.tx .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;white-space:nowrap}
.tx.ghost{opacity:.55}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .e{font-size:40px;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--card2);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:color-mix(in srgb,var(--exp) 14%,transparent);color:var(--exp)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:550;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:#fff}
.summary3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.summary3 .card{padding:10px 12px}.summary3 .v{font-weight:700;font-size:15px;white-space:nowrap}
.goal .ge{font-size:26px;width:46px;height:46px;border-radius:12px;background:var(--card2);display:grid;place-items:center;flex:none}
.goal .bar{height:10px}
.banner{max-width:1100px;margin:8px auto 0;padding:0 16px}
.banner>div{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;background:color-mix(in srgb,var(--sav) 14%,var(--card));box-shadow:var(--shadow)}
.banner.ex>div{background:color-mix(in srgb,var(--warn) 18%,var(--card))}
.banner .grow{flex:1}
.banner button{font-weight:650;color:var(--accent);padding:6px 8px;white-space:nowrap}
.banner button.x{color:var(--muted)}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(78px + var(--safe-b));z-index:31;width:62px;height:62px;border-radius:50%;background:var(--accent);color:#fff;font-size:34px;font-weight:300;line-height:1;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent),0 2px 6px rgba(0,0,0,.2);display:grid;place-items:center;transition:transform .15s}
.fab:active{transform:scale(.92)}
/* sheet */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.backdrop.open{display:flex;animation:fadeb .2s}
@keyframes fadeb{from{background:rgba(0,0,0,0)}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + var(--safe-b));animation:up .25s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{font-size:15px;color:var(--muted);font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{padding:9px;border-radius:10px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--card);box-shadow:var(--shadow);color:var(--text)}
.seg button.on.g{color:var(--exp)}.seg button.on.i{color:var(--inc)}
.amountbox{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:6px 0 14px}
.amountbox{flex-wrap:nowrap}.amountbox input{border:0;background:none;outline:none;font-size:46px;font-weight:750;text-align:right;width:1.6ch;min-width:1.6ch;max-width:80%;letter-spacing:-.02em;padding:0}
.amountbox span{font-size:30px;font-weight:650;color:var(--muted)}
.lbl{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 2px 6px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats .chip{box-shadow:none;background:var(--card2)}
.cats .chip.on{background:var(--accent);color:#fff}
.field{display:block;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);outline:none;-webkit-appearance:none;appearance:none;min-height:46px}
.field:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px}
.switch input{width:46px;height:28px;-webkit-appearance:none;appearance:none;background:var(--line);border-radius:99px;position:relative;transition:.2s;flex:none;margin:0}
.switch input::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:20px}
.sheet .actions{display:flex;gap:8px;margin-top:16px}
.sheet .actions .btn{flex:1;padding:14px}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:#1d232b;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.note{font-size:13px;color:var(--muted);margin:8px 4px}
svg text{font-family:inherit}
@media (min-width:860px){
  body{padding-bottom:40px}
  .tabbar{position:sticky;top:calc(var(--safe-t) + 58px);bottom:auto;max-width:1100px;margin:0 auto;border:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;justify-content:flex-start;gap:6px;padding:4px 16px;z-index:19}
  .tabbar button{flex:none;flex-direction:row;font-size:14px;gap:6px;padding:8px 14px;border-radius:999px}
  .tabbar button svg{width:18px;height:18px}
  .tabbar button.on{background:var(--card);box-shadow:var(--shadow)}
  .fab{bottom:28px;right:28px}
  .kpis{grid-template-columns:2fr 1fr 1fr}
  .kpi.big{grid-column:auto}
  .dash2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .dash2>div>h2:first-child{margin-top:22px}
  .backdrop{align-items:center}
  .sheet{border-radius:22px;max-height:88vh}
  .toast{bottom:40px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><i>€</i><span>Finanzas</span></div>
  <div class="monthnav">
    <button id="prevM" aria-label="Mes anterior">‹</button>
    <button id="curM" class="ml" title="Volver al mes actual"></button>

</div></header>

  <button data-tab="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Movimientos</button>
  <button data-tab="presu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 6"/></svg>Presupuestos</button>
  <button data-tab="obj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Objetivos</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>

  <section class="tab" id="tab-movs"></section>

<script>
"use strict";
const LS_KEY='finanzas-edu-v1';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmtE=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
const fmtE0=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fmtN=new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>fmtE.format(Math.round((n||0)*100)/100);
const money0=n=>fmtE0.format(n||0);
const pct=n=>new Intl.NumberFormat('es-ES',{style:'percent',maximumFractionDigits:0}).format(n||0);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayS=()=>ymd(new Date());
const thisMonth=()=>todayS().slice(0,7);
const addMonth=(k,n)=>{let[y,m]=k.split('-').map(Number);let t=y*12+(m-1)+n;return `${Math.floor(t/12)}-${pad(t%12+1)}`};
const daysIn=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const monthLabel=(k,opt={month:'long',year:'numeric'})=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es-ES',opt)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseAmt=s=>{s=String(s||'').replace(/[\s€]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:NaN};
const amtInput=n=>n?fmtN.format(n).replace(/\./g,''):'';

const PALETTE=['#0f9d7a','#3b82f6','#f59e0b','#e5484d','#8b5cf6','#ec4899','#14b8a6','#f97316','#64748b','#84cc16','#06b6d4','#a855f7','#ef4444','#22c55e'];
const DEFAULT_CATS=[
 ['Vivienda','🏠','gasto'],['Coche/combustible','🚗','gasto'],['Comida','🛒','gasto'],['Facturas (luz, agua, internet, móvil)','💡','gasto'],
 ['Cuota autónomo','🧾','gasto'],['Impuestos (IVA/IRPF)','🏛️','gasto'],['Material de trabajo','🩺','gasto'],['Ocio','🎉','gasto'],
 ['Salud','❤️','gasto'],['Ropa','👕','gasto'],['Suscripciones','📺','gasto'],['Otros','📦','gasto'],
 ['Sesiones fisioterapia','💆','ingreso'],['Otros ingresos','💶','ingreso']];
function defaultState(){
  return {v:1,settings:{taxOn:true,taxPct:20,lastBackup:null,remindDismissed:null,example:false,created:todayS()},
    categories:DEFAULT_CATS.map(([name,icon,type],i)=>({id:'c'+i,name,icon,type,budget:0,color:PALETTE[i%PALETTE.length]})),
    transactions:[],recurring:[],goals:[],recent:[]};
}
let S;
function load(){
  try{const raw=localStorage.getItem(LS_KEY);S=raw?JSON.parse(raw):defaultState();}catch(e){S=defaultState();}
  const d=defaultState();S.settings=Object.assign(d.settings,S.settings||{});
  for(const k of ['categories','transactions','recurring','goals','recent'])if(!Array.isArray(S[k]))S[k]=d[k];
  if(!S.categories.length)S.categories=d.categories;
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){toast('⚠️ No se pudo guardar en este dispositivo');}}

let cur=thisMonth(), tab='resumen', movFilter='todos';
const cat=id=>S.categories.find(c=>c.id===id)||{name:'Sin categoría',icon:'❔',color:'#94a3b8',type:'gasto'};
const catsOf=type=>S.categories.filter(c=>c.type===type);
const txOf=k=>S.transactions.filter(t=>t.date.slice(0,7)===k);
function totals(k){let inc=0,exp=0;for(const t of txOf(k)){if(t.type==='ingreso')inc+=t.amount;else exp+=t.amount;}return{inc,exp,sav:inc-exp,rate:inc>0?(inc-exp)/inc:0};}
function spentBy(k){const m={};for(const t of txOf(k))if(t.type==='gasto')m[t.catId]=(m[t.catId]||0)+t.amount;return m;}

/* ---------- recurrentes ---------- */
function applyRecurring(){
  const now=thisMonth();let changed=false;
  for(const r of S.recurring){
    if(!r.active)continue;r.applied=r.applied||[];
    for(let m=r.start;m<=now;m=addMonth(m,1)){
      if(r.end&&m>r.end)break;
      if(r.applied.includes(m))continue;
      const day=Math.min(r.day||1,daysIn(m));const date=`${m}-${pad(day)}`;
      if(m===now&&date>todayS())continue; // aún no ha llegado el día
      S.transactions.push({id:uid(),type:r.type,amount:r.amount,date,catId:r.catId,note:r.note||'',recurringId:r.id});
      r.applied.push(m);changed=true;
    }
  }
  if(changed)save();
}
function pendingRecurring(k){ // previstos aún no aplicados en el mes k
  return S.recurring.filter(r=>r.active&&r.start<=k&&!(r.end&&k>r.end)&&!(r.applied||[]).includes(k))
    .map(r=>({ghost:true,id:'g'+r.id,rid:r.id,type:r.type,amount:r.amount,date:`${k}-${pad(Math.min(r.day||1,daysIn(k)))}`,catId:r.catId,note:r.note}));
}

/* ---------- gráficos SVG ---------- */
function donut(data,size=170){
  const total=data.reduce((a,b)=>a+b.v,0);const r=size/2-14,c=2*Math.PI*r;let off=0;
  let segs=total>0?data.map(d=>{const len=d.v/total*c;const s=`<circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${d.color}" stroke-width="22" stroke-dasharray="${Math.max(len-1.5,0.01)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=len;return s}).join('')
    :`<circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="var(--card2)" stroke-width="22"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Gastos por categoría">${segs}
   <text x="50%" y="46%" text-anchor="middle" font-size="12" fill="var(--muted)">Gastos</text>
   <text x="50%" y="58%" text-anchor="middle" font-size="17" font-weight="750" fill="var(--text)">${esc(money0(total))}</text></svg>`;
}
function barChart(months){
  const W=innerWidth<600?420:640,H=innerWidth<600?250:230,pl=44,pr=8,pt=10,pb=26;const rows=months.map(k=>({k,...totals(k)}));
  let max=Math.max(1,...rows.map(r=>Math.max(r.inc,r.exp,r.sav)));let min=Math.min(0,...rows.map(r=>r.sav));
  const nice=v=>{if(v<=0)return 0;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p};
  max=nice(max);if(min<0)min=-nice(-min);
  const y=v=>pt+(max-v)/(max-min)*(H-pt-pb);const gw=(W-pl-pr)/rows.length,bw=Math.min(12,gw/4);
  let g='';const ticks=4;
  for(let i=0;i<=ticks;i++){const v=min+(max-min)*i/ticks;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.abs(v)>=1000?(v/1000).toLocaleString('es-ES',{maximumFractionDigits:1})+'k':Math.round(v)}</text>`;}
  if(min<0)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  rows.forEach((r,i)=>{const x0=pl+gw*i+gw/2-bw*1.5-1;
    [[r.inc,'var(--inc)'],[r.exp,'var(--exp)'],[r.sav,'var(--sav)']].forEach(([v,col],j)=>{const ya=y(Math.max(v,0)),yb=y(Math.min(v,0));
      g+=`<rect x="${x0+j*(bw+1)}" y="${ya}" width="${bw}" height="${Math.max(yb-ya,v?1:0)}" rx="2.5" fill="${col}"><title>${monthLabel(r.k)} · ${['Ingresos','Gastos','Ahorro'][j]}: ${money(v)}</title></rect>`;});
    const sel=r.k===cur;
    g+=`<text x="${pl+gw*i+gw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" font-weight="${sel?700:400}" fill="${sel?'var(--text)':'var(--muted)'}">${monthLabel(r.k,{month:'short'}).replace('.','')}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ingresos, gastos y ahorro de los últimos 12 meses">${g}</svg>
  <div class="chartlegend"><span><i class="dot" style="background:var(--inc)"></i>Ingresos</span><span><i class="dot" style="background:var(--exp)"></i>Gastos</span><span><i class="dot" style="background:var(--sav)"></i>Ahorro</span></div>`;
}

  const lb=S.settings.lastBackup;
  if(!lb){const c=S.settings.created||todayS();return (Date.now()-new Date(c+'T12:00'))/864e5>=7;}

function catChips(type,sel){
  const rec=S.recent.filter(id=>cat(id).type===type&&S.categories.some(c=>c.id===id)).slice(0,4);

    +`<div class="cats">${all.filter(c=>!rec.includes(c.id)).map(chip).join('')}</div>`;

      ${isRec?`<div><div class="lbl" style="margin-top:0">Día del mes</div><input class="field" id="fDay" type="number" inputmode="numeric" min="1" max="31" value="${existing?.day||new Date().getDate()}"></div>`
      :`<div><div class="lbl" style="margin-top:0">Fecha</div><input class="field" id="fDate" type="date" value="${st.date||existing?.date||defaultDate()}"></div>`}
      <div><div class="lbl" style="margin-top:0">Nota</div><input class="field" id="fNote" type="text" placeholder="Opcional" value="${esc(st.note??existing?.note??'')}" enterkeyhint="done"></div>
    </div>
    ${!existing&&!isRec?`<label class="switch"><span><b>Repetir cada mes</b><div class="small muted">Alquiler, cuota de autónomo, seguros…</div></span><input type="checkbox" id="fRec" ${st.rec?'checked':''}></label>`:''}
    ${isRec&&existing?`<label class="switch"><span><b>Activo</b><div class="small muted">Si lo pausas, deja de apuntarse los próximos meses</div></span><input type="checkbox" id="fActive" ${existing.active?'checked':''}></label>`:''}
    ${existing?.recurringId?`<p class="note">🔁 Generado por un fijo mensual. Los cambios solo afectan a este mes.</p>`:''}
    <div class="actions">${existing?`<button class="btn danger" data-del>Eliminar</button>`:''}<button class="btn primary" data-save>Guardar</button></div>`;
  };
  const keep=()=>{st.amt=$('#fAmt').value;st.note=$('#fNote').value;if($('#fDate'))st.date=$('#fDate').value;if($('#fRec'))st.rec=$('#fRec').checked;};
  openSheet('');draw();
  const sh=$('#sheet');
  const amt=$('#fAmt');amt.focus();if(existing)amt.select();sizeAmt();
  sh.onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.x!==undefined)return closeSheet();
    if(b.dataset.type&&b.closest('.seg')){keep();st.type=b.dataset.type;st.catId=defaultCat(st.type);draw();sizeAmt();$('#fAmt').focus();return;}
    if(b.dataset.pick){st.catId=b.dataset.pick;$$('#fCats .chip').forEach(c=>c.classList.toggle('on',c.dataset.pick===st.catId));return;}
    if(b.dataset.save!==undefined)return doSave();
    if(b.dataset.del!==undefined){
      if(isRec){
        if(!confirm('¿Eliminar este fijo mensual? Los movimientos ya apuntados se mantienen.'))return;
        S.recurring=S.recurring.filter(r=>r.id!==existing.id);
      }else{if(!confirm('¿Eliminar este movimiento?'))return;S.transactions=S.transactions.filter(t=>t.id!==existing.id);}
      save();closeSheet();render();toast('Eliminado');
    }
  };
  sh.oninput=e=>{if(e.target.id==='fAmt')sizeAmt();};
  sh.onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){e.preventDefault();doSave();}};
  function doSave(){
    const a=parseAmt($('#fAmt').value);
    if(!(a>0)){toast('Escribe un importe');$('#fAmt').focus();return;}
    if(!st.catId){toast('Elige una categoría');return;}
    const note=$('#fNote').value.trim();
    S.recent=[st.catId,...S.recent.filter(x=>x!==st.catId)].slice(0,12);
    if(isRec){
      const day=Math.min(31,Math.max(1,parseInt($('#fDay').value)||1));
      if(existing){Object.assign(existing,{type:st.type,amount:a,catId:st.catId,note,day,active:$('#fActive').checked});}
      else{S.recurring.push({id:uid(),type:st.type,amount:a,catId:st.catId,note,day,start:cur<thisMonth()?cur:thisMonth(),active:true,applied:[]});}
      applyRecurring();save();closeSheet();render();toast('Fijo mensual guardado');return;
    }
    const date=$('#fDate').value||defaultDate();
    if(existing){Object.assign(existing,{type:st.type,amount:a,catId:st.catId,note,date});}
    else{
      const t={id:uid(),type:st.type,amount:a,catId:st.catId,note,date};
      if($('#fRec')?.checked){const r={id:uid(),type:st.type,amount:a,catId:st.catId,note,day:Number(date.slice(8,10)),start:date.slice(0,7),active:true,applied:[date.slice(0,7)]};S.recurring.push(r);t.recurringId=r.id;}
      S.transactions.push(t);
    }
    save();closeSheet();
    if(date.slice(0,7)!==cur)cur=date.slice(0,7);
    render();
    const c=cat(st.catId);let msg=(existing?'Actualizado':'Añadido')+`: ${c.icon} ${st.type==='ingreso'?'+':'−'}${money(a)}`;
    if(st.type==='gasto'&&c.budget>0){const s=spentBy(date.slice(0,7))[c.id]||0;if(s>c.budget)msg=`⚠️ Te has pasado del presupuesto de ${c.name}: ${money0(s)} de ${money0(c.budget)}`;else if(s>=c.budget*.8)msg+=` · llevas el ${pct(s/c.budget)} de ${c.name}`;}
    toast(msg,3500);
  }
}

function sizeAmt(){const i=$('#fAmt')||$('#kAmt');if(i)i.style.width=Math.max(1,(i.value||i.placeholder).length)*0.62+0.9+'em';}
function openCat(c,type){
  const isNew=!c;c=c||{id:uid(),name:'',icon:'🏷️',type,budget:0,color:PALETTE[S.categories.length%PALETTE.length]};
  openSheet(`<h3>${isNew?'Nueva categoría':'Editar categoría'}<button data-x>Cerrar</button></h3>
   <div class="two" style="grid-template-columns:80px 1fr"><div><div class="lbl">Icono</div><input class="field" id="cIcon" value="${esc(c.icon)}" maxlength="4" style="text-align:center;font-size:22px;padding:8px"></div><div><div class="lbl">Nombre</div><input class="field" id="cName" value="${esc(c.name)}" placeholder="Ej.: Gimnasio"></div></div>
   ${c.type==='gasto'?`<div class="lbl">Presupuesto mensual (opcional)</div><input class="field" id="cBud" inputmode="decimal" placeholder="Sin límite" value="${c.budget?amtInput(c.budget):''}">`:''}
   <div class="lbl">Color</div><div class="cats">${PALETTE.map(p=>`<button class="chip" data-color="${p}" style="width:34px;height:34px;padding:0;background:${p};outline:${p===c.color?'3px solid var(--text)':'none'};outline-offset:2px"></button>`).join('')}</div>
   <div class="actions">${!isNew?`<button class="btn danger" data-del>Eliminar</button>`:''}<button class="btn primary" data-save>Guardar</button></div>`);
  let color=c.color;const sh=$('#sheet');
  sh.onkeydown=null;sh.oninput=null;
  sh.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.x!==undefined)return closeSheet();
    if(b.dataset.color){color=b.dataset.color;$$('[data-color]',sh).forEach(x=>x.style.outline=x.dataset.color===color?'3px solid var(--text)':'none');return;}
    if(b.dataset.save!==undefined){const name=$('#cName').value.trim();if(!name)return toast('Escribe un nombre');
      c.name=name;c.icon=$('#cIcon').value.trim()||'🏷️';c.color=color;if($('#cBud')){const v=parseAmt($('#cBud').value);c.budget=v>0?v:0;}
      if(isNew)S.categories.push(c);save();closeSheet();render();toast('Categoría guardada');}
    if(b.dataset.del!==undefined){const others=catsOf(c.type).filter(x=>x.id!==c.id);if(!others.length)return toast('Debe quedar al menos una categoría');
      const fallback=others.find(x=>/^Otros/.test(x.name))||others[0];
      const n=S.transactions.filter(t=>t.catId===c.id).length;
      if(!confirm(`¿Eliminar “${c.name}”?${n?` Sus ${n} movimientos pasarán a “${fallback.name}”.`:''}`))return;
      S.transactions.forEach(t=>{if(t.catId===c.id)t.catId=fallback.id});S.recurring.forEach(r=>{if(r.catId===c.id)r.catId=fallback.id});
      S.categories=S.categories.filter(x=>x.id!==c.id);save();closeSheet();render();toast('Categoría eliminada');}
  };
}
function openGoal(g){
  const isNew=!g;g=g||{id:uid(),name:'',icon:'🎯',target:0,current:0,deadline:'',contributions:[]};
  openSheet(`<h3>${isNew?'Nuevo objetivo':'Editar objetivo'}<button data-x>Cerrar</button></h3>
   <div class="two" style="grid-template-columns:80px 1fr"><div><div class="lbl">Icono</div><input class="field" id="gIcon" value="${esc(g.icon)}" maxlength="4" style="text-align:center;font-size:22px;padding:8px"></div><div><div class="lbl">Nombre</div><input class="field" id="gName" value="${esc(g.name)}" placeholder="Ej.: Fondo de emergencia"></div></div>
   <div class="two"><div><div class="lbl">Meta (€)</div><input class="field" id="gTarget" inputmode="decimal" value="${amtInput(g.target)}" placeholder="10.000"></div>
   <div><div class="lbl">${isNew?'Ya ahorrado (€)':'Ahorrado (€)'}</div><input class="field" id="gCur" inputmode="decimal" value="${amtInput(g.current)}" placeholder="0"></div></div>
   <div class="lbl">Fecha objetivo (opcional)</div><input class="field" id="gDead" type="date" value="${g.deadline||''}">
   <div class="actions">${!isNew?`<button class="btn danger" data-del>Eliminar</button>`:''}<button class="btn primary" data-save>Guardar</button></div>`);
  const sh=$('#sheet');sh.onkeydown=null;sh.oninput=null;
  sh.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.x!==undefined)return closeSheet();
    if(b.dataset.save!==undefined){const name=$('#gName').value.trim(),target=parseAmt($('#gTarget').value);
      if(!name)return toast('Escribe un nombre');if(!(target>0))return toast('Indica la meta en euros');
      Object.assign(g,{name,icon:$('#gIcon').value.trim()||'🎯',target,current:parseAmt($('#gCur').value)||0,deadline:$('#gDead').value});
      if(isNew)S.goals.push(g);save();closeSheet();render();toast('Objetivo guardado');}
    if(b.dataset.del!==undefined){if(!confirm(`¿Eliminar el objetivo “${g.name}”?`))return;S.goals=S.goals.filter(x=>x.id!==g.id);save();closeSheet();render();}
  };
}
function openContrib(g,neg){
  openSheet(`<h3>${neg?'Retirar de':'Aportar a'} ${esc(g.name)}<button data-x>Cerrar</button></h3>
   <div class="amountbox"><input id="kAmt" type="text" inputmode="decimal" placeholder="0" enterkeyhint="done" style="color:${neg?'var(--exp)':'var(--inc)'}"><span>€</span></div>
   <div class="lbl">Fecha</div><input class="field" id="kDate" type="date" value="${todayS()}">
   <div class="actions"><button class="btn primary" data-save>${neg?'Retirar':'Aportar'}</button></div>`);
  const sh=$('#sheet');$('#kAmt').focus();sizeAmt();sh.oninput=sizeAmt;
  const go=()=>{let a=parseAmt($('#kAmt').value);if(!(a>0))return toast('Escribe un importe');if(neg)a=-a;
    g.current=Math.round((g.current+a)*100)/100;(g.contributions=g.contributions||[]).push({date:$('#kDate').value||todayS(),amount:a});
    save();closeSheet();render();toast(g.current>=g.target&&!neg?'🎉 ¡Objetivo conseguido!':`${g.name}: ${money(g.current)}`);};
  sh.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.x!==undefined)return closeSheet();if(b.dataset.save!==undefined)go();};
  sh.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};
}

/* ---------- exportar / importar ---------- */
async function shareOrDownload(name,content,mime){
  const blob=new Blob([content],{type:mime});
  try{const file=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/iP(hone|ad|od)|Android/.test(navigator.userAgent)){await navigator.share({files:[file],title:name});return true;}
  }catch(e){if(e.name==='AbortError')return false;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return true;
}
async function exportJSON(){
  const ok=await shareOrDownload(`finanzas-copia-${todayS()}.json`,JSON.stringify({app:'finanzas-edu',exported:new Date().toISOString(),data:S},null,1),'application/json');
  if(ok){S.settings.lastBackup=new Date().toISOString();save();render();toast('💾 Copia exportada');}
}
function toCSV(list){
  const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['Fecha','Tipo','Categoría','Nota','Importe (€)','Fijo mensual']];
  list.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>rows.push([t.date.split('-').reverse().join('/'),t.type==='ingreso'?'Ingreso':'Gasto',cat(t.catId).name,t.note,(t.type==='ingreso'?t.amount:-t.amount).toFixed(2).replace('.',','),t.recurringId?'Sí':'No']));
  return '\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}
function importJSON(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const j=JSON.parse(fr.result);const d=j.data||j;
      if(!d||!Array.isArray(d.transactions)||!Array.isArray(d.categories))throw new Error('formato');
      if(!confirm(`Se importarán ${d.transactions.length} movimientos y se sustituirán los datos actuales. ¿Continuar?`))return;
      localStorage.setItem(LS_KEY,JSON.stringify(d));load();applyRecurring();render();toast('📂 Copia importada');
    }catch(e){alert('No se ha podido leer el archivo. ¿Es una copia exportada desde esta app?');}};
  fr.readAsText(file);
}
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)importJSON(f);e.target.value='';});

/* ---------- datos de ejemplo ---------- */
function loadExample(){
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const rr=(a,b)=>Math.round((a+rnd()*(b-a))*100)/100;
  const s=defaultState();s.settings.example=true;
  const C=n=>s.categories.find(c=>c.name.startsWith(n)).id;
  Object.assign(s.categories.find(c=>c.name==='Comida'),{budget:400});Object.assign(s.categories.find(c=>c.name==='Ocio'),{budget:150});
  Object.assign(s.categories.find(c=>c.name.startsWith('Coche')),{budget:320});Object.assign(s.categories.find(c=>c.name==='Ropa'),{budget:80});
  Object.assign(s.categories.find(c=>c.name==='Suscripciones'),{budget:30});
  const now=thisMonth(),start=addMonth(now,-11),td=todayS();
  const rec=(note,cat,amount,day,type='gasto')=>s.recurring.push({id:uid(),type,amount,catId:C(cat),note,day,start,active:true,applied:[]});
  rec('Alquiler','Vivienda',850,1);rec('Cuota autónomos','Cuota',294,28);rec('Seguro coche','Coche',41.5,5);
  rec('Fibra + móvil','Facturas',52.9,10);rec('Netflix','Suscripciones',13.99,15);rec('Spotify','Suscripciones',11.99,20);rec('Seguro de salud','Salud',48,3);
  const T=[];const add=(date,catN,amount,note,type='gasto')=>{if(date<=td)T.push({id:uid(),type,amount,date,catId:C(catN),note})};
  for(let m=start;m<=now;m=addMonth(m,1)){const mo=Number(m.slice(5)),dim=daysIn(m);const d=n=>`${m}-${pad(Math.min(n,dim))}`;
    const weeks=mo===8?2:4;for(let w=0;w<weeks;w++)add(d(7*w+4),'Sesiones',rr(680,1050),`Sesiones semana ${w+1}`,'ingreso');
    if(rnd()>.6)add(d(18),'Otros ingresos',rr(80,250),'Taller en gimnasio','ingreso');
    for(let i=0;i<4;i++)add(d(3+i*7),'Coche',rr(52,78),'Gasolina');
    for(let i=0;i<6;i++)add(d(2+i*5),'Comida',rr(28,85),i%2?'Mercadona':'Fruta y verdura');
    add(d(12),'Facturas',rr(45,95),'Luz');if(mo%2===0)add(d(14),'Facturas',rr(22,34),'Agua');
    if([1,4,7,10].includes(mo))add(d(20),'Impuestos',rr(520,760),'IRPF modelo 130');
    if(rnd()>.4)add(d(9),'Material',rr(25,140),rnd()>.5?'Cremas y aceites':'Vendaje neuromuscular');
    for(let i=0;i<3;i++)add(d(6+i*8),'Ocio',rr(18,65),['Cena con amigos','Cine','Escapada'][i]);
    if(rnd()>.55)add(d(22),'Ropa',rr(30,110),'Ropa de trabajo');
    if(rnd()>.7)add(d(16),'Salud',rr(20,60),'Farmacia');
    if(rnd()>.6)add(d(25),'Otros',rr(10,60),'Varios');
  }
  s.transactions=T;
  const g1={id:uid(),name:'Fondo de emergencia',icon:'🛟',target:9000,current:0,deadline:`${addMonth(now,14)}-01`,contributions:[]};
  const g2={id:uid(),name:'Coche',icon:'🚗',target:8000,current:0,deadline:`${addMonth(now,2)}-28`,contributions:[]};
  for(let m=start;m<=now;m=addMonth(m,1)){const dt=`${m}-28`;if(dt>td)continue;g1.contributions.push({date:dt,amount:300});g2.contributions.push({date:dt,amount:450});}
  g1.current=1500+g1.contributions.reduce((a,c)=>a+c.amount,0);g2.current=g2.contributions.reduce((a,c)=>a+c.amount,0);
  s.goals=[g1,g2];s.recent=[C('Comida'),C('Coche'),C('Ocio'),C('Sesiones')];
  S=s;applyRecurring();save();cur=now;render();toast('🧪 Datos de ejemplo cargados');
}

/* ---------- eventos globales ---------- */
function goTab(t){tab=t;$$('.tab').forEach(s=>s.classList.toggle('active',s.id==='tab-'+t));$$('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));window.scrollTo({top:0});}
$('#tabbar').addEventListener('click',e=>{const b=e.target.closest('button');if(b)goTab(b.dataset.tab);});
$('#prevM').onclick=()=>{cur=addMonth(cur,-1);render();};
$('#nextM').onclick=()=>{cur=addMonth(cur,1);render();};
$('#curM').onclick=()=>{cur=thisMonth();render();};
$('#fab').onclick=()=>openTx(null);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tx],[data-rec],[data-filter],[data-cat],[data-editgoal],[data-contrib],[data-tab-go]');if(!b||b.closest('#sheet'))return;
  if(b.dataset.tabGo)return goTab(b.dataset.tabGo);
  if(b.dataset.tx){const t=S.transactions.find(x=>x.id===b.dataset.tx);if(t)openTx(t);return;}
  if(b.dataset.rec){const r=S.recurring.find(x=>x.id===b.dataset.rec);if(r)openTx(r,'rec');return;}
  if(b.dataset.filter){movFilter=b.dataset.filter;renderMovs();return;}
  if(b.dataset.cat){openCat(S.categories.find(c=>c.id===b.dataset.cat));return;}
  if(b.dataset.editgoal){openGoal(S.goals.find(g=>g.id===b.dataset.editgoal));return;}
  if(b.dataset.contrib){openContrib(S.goals.find(g=>g.id===b.dataset.contrib),!!b.dataset.neg);return;}
  switch(b.dataset.act){
    case'add':return openTx(null);
    case'addrec':return openTx(null,'rec');
    case'addcat':return openCat(null,b.dataset.type);
    case'addgoal':return openGoal(null);
    case'export':return exportJSON();
    case'import':return $('#importFile').click();
    case'csv':return shareOrDownload(`finanzas-${cur}.csv`,toCSV(txOf(cur)),'text/csv');
    case'csvall':return shareOrDownload(`finanzas-completo-${todayS()}.csv`,toCSV(S.transactions),'text/csv');
    case'dismiss-backup':S.settings.remindDismissed=thisMonth();save();renderBanners();return;
    case'example':if(S.transactions.length&&!S.settings.example&&!confirm('Los datos de ejemplo sustituirán a tus datos actuales. ¿Continuar? (Te recomiendo exportar una copia antes.)'))return;return loadExample();
    case'reset-example':S=defaultState();save();render();toast('Datos de ejemplo borrados');return;
    case'reset':if(!confirm('¿Seguro que quieres borrar TODOS tus datos? Esta acción no se puede deshacer.'))return;
      if(S.transactions.length>20&&!S.settings.example&&prompt('Escribe BORRAR para confirmar')!=='BORRAR')return;
      S=defaultState();save();cur=thisMonth();render();toast('Datos borrados');return;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='taxOn'){S.settings.taxOn=e.target.checked;save();render();}
  if(e.target.id==='taxPct'){const v=parseAmt(e.target.value);if(v>=0&&v<=60){S.settings.taxPct=v;save();render();toast(`Apartarás el ${v.toLocaleString('es-ES')} % de tus ingresos`);}else{toast('Introduce un porcentaje entre 0 y 60');renderAjustes();}}
});
// Si la app se queda abierta y cambia el mes, aplica fijos al volver
document.addEventListener('visibilitychange',()=>{if(!document.hidden){applyRecurring();render();}});

load();applyRecurring();render();
</script>
